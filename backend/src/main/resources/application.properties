spring.application.name=trip-war-room
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/trip_war_room?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:tripuser}
spring.datasource.password=${DB_PASSWORD:trip_password_change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.error.include-message=always
